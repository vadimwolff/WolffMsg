#
# The single public entry point.
#
# Static files are served from here; /api and /ws go to the server container.
# The browser therefore sees one origin, which is what keeps the session cookie
# `SameSite=strict` and lets the CSRF defence rest on the browser rather than
# on application code alone.
#
# TLS is deliberately not configured here. Terminate it in front of this
# container — a load balancer, Caddy, or an nginx you already run — because
# certificate issuance and renewal are the deployment's business, not the
# image's. Set COOKIE_SECURE=true on the server once you have.

upstream wolffmsg_api {
    server server:4000;
    keepalive 32;
}

# Uploads are encrypted client-side and streamed; the server enforces the real
# limit (MAX_ATTACHMENT_BYTES) and rejects oversize bodies mid-flight. This is
# a coarse outer bound so nginx does not buffer something absurd first.
client_max_body_size 128m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Content-Security-Policy for the document is emitted into the built
    # HTML as a <meta http-equiv> — see packages/web/csp.ts — so that it also
    # protects deployments on static hosts that cannot set headers. What is
    # left is the one directive a meta tag cannot express, plus the headers the
    # policy does not cover. API responses carry their own, set by the server.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://wolffmsg_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The server checks Origin on every unsafe request; it must arrive
        # unaltered or that check has nothing to work with.
        proxy_set_header Origin $http_origin;

        # Uploads and downloads stream; buffering them would defeat the
        # progress reporting and hold large blobs in nginx's memory.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://wolffmsg_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;

        # The socket sends its own heartbeat every 30s; this is comfortably
        # longer so a healthy idle connection is never cut.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Build output is content-hashed, so it can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be served stale, or a deploy cannot
    # replace the one already installed in someone's browser.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any unknown path renders the client, which decides what
    # to show. `=404` rather than a redirect so the URL is preserved.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
