<!doctype html>
<html lang="en" data-theme="dark" data-accent="aurora" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06070a" />
    <meta name="color-scheme" content="dark light" />
    <title>WolffMsg</title>
    <meta name="description" content="WolffMsg — private, end-to-end encrypted messaging." />

    <!-- No referrer leaves this origin, and no third-party host is contacted. -->
    <meta name="referrer" content="no-referrer" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WolffMsg" />

    <!--
      Paint the stored theme before React mounts. Without this the page flashes
      the default dark palette for a frame on a light-theme device.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wolff.appearance');
          var pref = stored ? JSON.parse(stored) : null;
          var theme = pref && pref.theme ? pref.theme : 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          var root = document.documentElement;
          root.dataset.theme = theme;
          if (pref && pref.accent) root.dataset.accent = pref.accent;
          if (pref && pref.messageDensity) root.dataset.density = pref.messageDensity;
          if (pref && pref.fontScale) {
            root.style.setProperty('--font-scale', String(pref.fontScale));
          }
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f2f4f9' : '#06070a');
        } catch (err) {
          /* A blocked localStorage must not stop the app booting. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      WolffMsg needs JavaScript: messages are encrypted and decrypted in your
      browser, so there is nothing meaningful the server could render without it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
